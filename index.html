<style>
:root{--bg:#f3f5f0;--card:#fff;--ink:#14201a;--sub:#5f6e66;--line:#dfe6dc;--brand:#1f7a55;--heroA:#0f3b2b;--heroB:#1a6a4a;--heroC:#2f8f63;--bad:#b3261e;--field:#f7f9f5}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1512;--card:#17201c;--ink:#e8f0eb;--sub:#9fb0a6;--line:#2a372f;--brand:#2f9a6b;--heroA:#0a2a1f;--heroB:#103d2c;--heroC:#1d5e43;--bad:#f2a49d;--field:#1c2722}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.top{background:linear-gradient(160deg,var(--heroA),var(--heroB) 60%,var(--heroC));height:38vh;min-height:220px;border-radius:0 0 28px 28px}
.wrap{max-width:420px;margin:-120px auto 0;padding:0 16px 40px}
.card{background:var(--card);border-radius:20px;padding:26px 22px 22px;box-shadow:0 10px 30px rgba(10,40,28,.14)}
.lock{width:52px;height:52px;border-radius:16px;background:linear-gradient(160deg,var(--heroB),var(--heroC));display:grid;place-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
p{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);outline:none}
input[type=password]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,122,85,.18)}
button{width:100%;font:inherit;font-size:16px;font-weight:600;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6}
.msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--bad)}
.u{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>

    <h1>노트</h1>
    <p>암호를 넣으면 이 기기 안에서만 풀립니다.</p>
    <input class="u" type="text" name="username" autocomplete="username" value="note" tabindex="-1" aria-hidden="true">
    <label class="f" for="pw">암호</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="go" type="submit">열기</button>

  </form>
</div>

      t1 = performance.now();
      return open(key).then(function (html) {
        show(html, { ms: Math.round(performance.now() - t0), kdf: Math.round(t1 - t0), how: '암호' });
      });
    }).catch(function () {
      $('go').disabled = false; $('go').textContent = '열기';
      $('msg').textContent = '풀리지 않습니다 — 암호가 다르거나 파일이 바뀌었습니다.';
      $('pw').select();
    });
  });
})();
</script>
</body>
